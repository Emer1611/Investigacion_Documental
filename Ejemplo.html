<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <title>LLenado de datos</title>
</head>
<body class="bg-secondary d-flex align-items-center justify-content-center vh-100">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-8">
        
        <div class="card bg-secondary-subtle border-0 shadow-lg rounded-4 p-4 text-light">
          <div class="card-body p-0">
            <h1 class="h4 card-title fw-bold text-dark mb-3">Mascara Telefonica</h1>
            <p class="text-secondary small mb-4">
              Formato dinamico y validacion con expresiones regulares.
            </p>

            <form novalidate>
              <div class="mb-3">
                <label for="telefono" class="form-label text-dark fw-semibold">
                  Numero de telefono:
                </label>
                <input 
                  type="text" 
                  class="form-control form-control-lg font-monospace tracking-wide" 
                  id="telefono" 
                  placeholder="####-####" 
                  maxlength="9" 
                  autocomplete="off"
                />
                <div class="valid-feedback">
                  Formato valido completado.
                </div>
                <div class="invalid-feedback">
                  Debe iniciar con 2, 6 o 7 y contener 8 digitos (ej. 7123-4567).
                </div>
              </div>
            </form>
          </div>
        </div>

      </div>
    </div>
  </main>


    <script src="js/script.js"></script>
</body>
</html>
